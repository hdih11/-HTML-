<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>登录页面</title>
		<style>
			body{
				background-image: ;
				background-color: rgb(224, 215, 208);
					background-repeat: no-repeat;
				font-family: Arial,sans-serif;
			}
			.container{
				position: absolute;
				max-width: 900px;
				width: 600px;
				margin: 0 auto;
				padding: 20px;
				background-color: rgb(red, green, blue);
				border-radius: 5px;
				box-shadow: 0 0 10px rgba(0,0,0,1);
				margin-top: 200px;
				left: 600px;
			}
			h1{
				text-align: center;
				font-family: 幼圆;
				
			}
			input[type="text"],
			input[type="password"]{
				width: 95%;
				padding: 10px;
				margin-bottom: 10px;
				border:1px solid #ccc;
				border-radius: 5px;
			}
			input[type="submit"]{
				width: 100%;
				padding: 10px;
				background-color: #4CAF50;
				color: #fff;
				border: none;
				border-radius:5px;
				cursor: pointer;
			}
			.forgot-password{
				text-align: right;
				margin-bottom: 10px;
			}
			.social-login{
				text-align: center;
				margin-top: 20px;
			}
			.social-login a{
				display: inline-block;
				margin: 0 5px;
				text-decoration: none;
				color:#333;
			}
			.aaa1{
				position: relative;
				top: 200px;
				left: 200px;
			}
			.ddd{
				position: absolute;
				width: 100%;
				height: 129px;
				background-color: rgb(126, 64, 67);
				top:-10px;
			}
			.fff{
				position: absolute;
				width: 100%;
				height: 129px;
				background-color: rgb(126, 64, 67);
				top: 620px;
			}
		</style>
	</head>
	<body>
		
		<div class="container">
			<h1>登&nbsp;&nbsp;&nbsp;录</h1>
		<form class="ssss" action="#">
			<input type="text" id="username" name="user" placeholder="用户名/邮箱"/><br />
			<input type="password" name="password" placeholder="密码" />
			<label>
				<input type="checkbox" id="remember-me" />记住我
			</label>
			<div class="forgot-password">
				<a href="#">忘记密码</a>
			</div>
			<button onclick="ss()"  type="submit" value="登录">登录</button>
		</form>
		 <script type="text/javascript">
		                    var phone =  document.getElementById("ann").value.innerHTML;
		                    var pass = document.getElementById("b").value.innerHTML;
		                    //对账号密码进行加密
		                    var tmpParams = '{"用户名":"' + phone + '","密码":"' + pass + '"}';
		                    console.log("加密前的数据：" + tmpParams);
		                    var key = CryptoJS.enc.Utf8.parse("1B4I7NI8B0016E0A0A0A0000A3EEAF2C");
		                    console.log("key的值为：" + key);
		                    var enc = CryptoJS.AES.encrypt(tmpParams, key, {
		                        mode: CryptoJS.mode.ECB,
		                        padding: CryptoJS.pad.Pkcs7
		                    });
		                    var encryptData = enc.ciphertext.toString();
		                    console.log("加密后的结果为：" + encryptData);
		
		                    //对加密后的数据进行解密
		                    var encryptedHexStr = CryptoJS.enc.Hex.parse(encryptData);
		                    var encryptedBase64Str = CryptoJS.enc.Base64.stringify(encryptedHexStr);
		                    var decryptedData = CryptoJS.AES.decrypt(encryptedBase64Str, key, {
		                        mode: CryptoJS.mode.ECB,
		                        padding: CryptoJS.pad.Pkcs7
		                    });
		                    var decryptedStr = decryptedData.toString(CryptoJS.enc.Utf8);
		                    console.log("解密后的数据为:" + decryptedStr);
		            </script>
			<div class="social-login">
				<a href="#">使用微信登陆</a>
				<a href="#">使用手机号登录</a>
				<a href="#">使用支付宝登录</a>
			</div>
		</div>
		<div class="aaa1">
			<img src="img/logo.jpg" width="300px" height="300px"/>
		</div>
		<div class="ddd">
		</div>
		<div class="fff"></div>
	</body>
</html>
